name: ci

# This repository is public, so it also builds on pull requests — unlike
# the 55 private repos, there is no organization Actions quota to protect
# here, and it is the dependency of all of them: it is worth knowing
# whether a PR breaks it before merging.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest
